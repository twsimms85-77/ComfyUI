name: transcribe
on:
  push:
    branches:
      - claude/dreamina-clip-sequencing-3ycnkx
    paths:
      - .github/workflows/transcribe.yml

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 88bd0354f90a2cce8fdcc619e27adc15ff15dfbd
      - name: Download clips and transcribe with word timestamps
        run: |
          set -euo pipefail
          SRC_URL="$(cat media-url.txt)"
          curl -sSL --retry 3 -o media.zip "$SRC_URL"
          mkdir -p clips
          unzip -o -q media.zip -d clips
          pip install -q faster-whisper
          python3 - <<'PY'
          import glob, json, base64
          from faster_whisper import WhisperModel
          model = WhisperModel("small", device="cpu", compute_type="int8")
          out = {}
          for f in sorted(glob.glob("clips/**/*.mp4", recursive=True)):
              segs, info = model.transcribe(f, word_timestamps=True, vad_filter=True)
              words = []
              for s in segs:
                  for w in (s.words or []):
                      words.append({"w": w.word, "s": round(w.start, 2), "e": round(w.end, 2), "p": round(w.probability, 2)})
              key = f.split("/")[-1]
              out[key] = {"lang": info.language, "words": words}
              print(f"{key}: {''.join(x['w'] for x in words)}")
          payload = base64.b64encode(json.dumps(out).encode()).decode()
          print("TRANSCRIPT_B64_START")
          for i in range(0, len(payload), 800):
              print(payload[i:i+800])
          print("TRANSCRIPT_B64_END")
          PY
