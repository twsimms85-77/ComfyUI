name: media-transfer
on:
  push:
    branches:
      - claude/dreamina-clip-sequencing-3ycnkx
    paths:
      - media-url.txt
      - .github/workflows/media-transfer.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download zip and stage clips
        run: |
          set -euo pipefail
          SRC_URL="$(cat media-url.txt)"
          curl -sSL --retry 3 -o media.zip "$SRC_URL"
          ls -la media.zip
          file media.zip
          mkdir -p extracted clips
          unzip -o media.zip -d extracted
          find extracted -type f | head -60
          i=0
          find extracted -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.webm' \) | sort | while read -r f; do
            i=$((i+1))
            n=$(printf 'clip-%02d.mp4' "$i")
            cp "$f" "clips/$n"
            printf '%s\t%s\n' "$n" "$(basename "$f")" >> clips/manifest.tsv
          done
          ls -la clips
          cat clips/manifest.tsv || true
      - uses: actions/upload-artifact@v4
        with:
          name: dreamina-clips
          path: clips/
          retention-days: 2
