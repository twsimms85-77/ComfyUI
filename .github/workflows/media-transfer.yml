name: media-transfer
on:
  push:
    branches:
      - claude/dreamina-clip-sequencing-3ycnkx
    paths:
      - media-url.txt
      - transfer-pub.pem
      - .github/workflows/media-transfer.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download, encrypt, and push to transfer branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SRC_URL="$(cat media-url.txt)"
          curl -sSL --retry 3 -o media.zip "$SRC_URL"
          ls -la media.zip
          file media.zip
          # encrypt payload so it is never publicly readable in the repo
          openssl rand 32 > sym.key
          openssl enc -aes-256-cbc -pbkdf2 -in media.zip -out payload.enc -pass file:sym.key
          openssl pkeyutl -encrypt -pubin -inkey transfer-pub.pem -in sym.key -out key.enc
          sha256sum media.zip payload.enc > checksums.txt
          mkdir /tmp/transfer
          mv payload.enc key.enc checksums.txt /tmp/transfer/
          cd /tmp/transfer
          git init -b claude/dreamina-media-transfer
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Encrypted media transfer payload"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:claude/dreamina-media-transfer
